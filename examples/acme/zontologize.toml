[database]
schema = "zontologize"
graph = "zontologize_graph"
api_schema = "zontologize_api"
max_connections = 8
decisions = ""

[extract]
threads = 8
timeout_secs = 120
format = "markdown"
embedded_depth = 0
max_embedded_mb = 10
ocr_embedded_images = false
workers = 2
worker_memory_mb = 4000
worker_files = 200

[ocr]
languages = ["nl", "en"]
model_tier = "small"

[ontology]
files = ["ontology/acme.ttl", "ontology/units.ttl"]
languages = ["en", "nl"]
include = ["acme:Organisation", "acme:Site", "acme:Project", "acme:Procedure", "acme:Equipment", "acme:Document"]
exclude = []
document_class = "acme:Document"

[scan]
batch_size = 1000
hash_threads = 0
extract_batch = 200
chunk_batch = 200
rules_batch = 100
rules_threads = 0
ignore = ["**/~$*", "**/.~lock.*#", "**/Thumbs.db", "**/.DS_Store"]

[scan.kinds.pdf]
extensions = ["pdf"]
max_mb = 200

[scan.kinds.word]
extensions = ["doc", "docx", "rtf"]
max_mb = 50

[scan.kinds.sheet]
extensions = ["xls", "xlsx", "csv"]
max_mb = 50

[scan.kinds.slides]
extensions = ["ppt", "pptx", "odp"]
max_mb = 50

[scan.kinds.mail]
extensions = ["eml", "msg"]
max_mb = 25

[scan.kinds.text]
extensions = ["txt", "html", "htm"]
max_mb = 10

[scan.kinds.image]
extensions = ["png", "jpg", "jpeg", "tif", "tiff"]
max_mb = 50

[chunk]
max_chars = 2000
overlap = 200
text_search = "simple"
threads = 0

[models]
fit = "claude-code:sonnet"
extract = "claude-code:sonnet"
classify = "claude-code:haiku"
attributes = "claude-code:sonnet"
curate = "claude-code:sonnet"
eval = "claude-code:opus"
embed = "local:multilingual-e5-small"
# fit = "claude-code:haiku"
# fit = "openrouter:anthropic/claude-haiku-5.5"
# fit = "ollama:qwen3.5:4b"
chars_per_token = 2.0

[providers.claude-code]
concurrency = 2
timeout_secs = 300
max_window_use = 0.8
config_dirs = []
# config_dirs = ["~/.claude-a", "~/.claude-b"]
account_window_use = {}
# account_window_use = { "~/.claude-b" = 0.95 }

[providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
concurrency = 8
timeout_secs = 120
poll_minutes = 30

[providers.ollama]
concurrency = 1
timeout_secs = 900
think = false

[budget]
max_usd = 1.0
max_requests = 0
calibration_calls = 200
default_output_tokens = 300

[llm]
retry_backoff_secs = 2
wait_margin_secs = 60
unknown_reset_wait_minutes = 30
progress_secs = 60

[fit]
sample = 200
seed = "acme"
unmatched_share = 0.3
min_chars = 100
max_shortlist = 30
min_evidence = 2
proposal_namespace = "https://example.org/acme/proposal#"
out = "fit"
definition_chars = 200

[llm_extract]
min_chars = 100
sources = []
doc_types = []
paths = []
skip_paths = ["**/*_old.*", "**/archive/**"]
exclude = []
seed = "acme"
max_per_document = 3
unmatched_share = 0.3
min_letter_share = 0.5
min_ocr_confidence = 0.6
max_shortlist = 30
confidence = 0.7
resend_share = 0.2
min_evidence = 1
out = "extract"
read_batch = 2000
definition_chars = 200
max_known = 0
min_tag_words = 2
repeated_line_files = 10
quote_headers = ['(?i)-----\s*original message\s*-----']
threads = 0

[attributes]
confidence = 0.7
max_text_chars = 120
max_properties = 30
max_subjects = 50
context_chars = 400
out = "attributes"
read_batch = 2000
unit_symbols = 12
sources = []
doc_types = []
paths = []
seed = ""
# resend_share = 0.2
threads = 0
min_line_words = 2

[classify]
head_chars = 1500
min_chars = 50
confidence = 0.7
read_batch = 500
definition_chars = 200

[curate]
confidence = 0.9
max_members = 8
context_chars = 100
max_shortlist = 30
definition_chars = 200
out = "curate"

folder_classes = []
# folder_classes = ["acme:Project"]
gazetteer = ""
# gazetteer = "results/gazetteer.csv"
gazetteer_documents = 3
gazetteer_classes = []

[curate.not_in_class]
"acme:Site" = ["(?i)\\b(b\\.?v\\.?|n\\.?v\\.?)$"]

[gpu]
provider = "cpu"
device = 0

[review]
sample = 50
min_verdicts = 30
checked = 0.8

[run]
summary = "results/summary.md"
set = ""
targets = { found = 0.9, duplicates = 0.05, class_accuracy = 0.9, mentions = 0.9, relations = 0.9, attributes = 0.85, catch_rate = 0.9 }

[eval]
dir = "eval"
summary = "results/summary.md"
seed = "eval"
docs_per_kind = 3
min_doc_chars = 200
max_doc_chars = 6000
request_chars = 60000
questions = 25
attribute_chunks = 300
judge_batch = 10
judge_context = 600
judge_mentions = 100
judge_relations = 100
judge_attributes = 100
planted = 20
min_catch_rate = 0.9

[embed]
threads = 0
batch_size = 8
max_tokens = 512
min_chars = 50
min_letter_share = 0.5
min_ocr_confidence = 0.6
max_aliases = 5
cache_dir = ""
out = "eval"
eval_sample = 500
eval_max_expected = 20
read_batch = 2000
progress_secs = 30

[embed.models."multilingual-e5-small"]
max_tokens = 256

[embed.models."acme-minilm"]
repo = "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
revision = ""
file = "onnx/model.onnx"
data_files = []
tokenizer = "tokenizer.json"
pooling = "mean"
output = ""
normalize = true
passage_prefix = ""
query_prefix = ""
max_tokens = 128

[resolve]
strip_words = ["bv", "b v", "gmbh", "ltd", "inc"]
fuzzy_score = 0.92
fuzzy_auto = 1.01
embed_score = 0.9
max_candidates = 5
max_block = 1000
block_chars = 4
classes = []
neighbour_batch = 500

[resolve.similar]
property = "urn:zontologize#similarTo"
tolerance = 0.2
min_shared = 2
min_score = 0.8
max_links = 5
weights = { "acme:ratedPower" = 2.0, "acme:dischargePressure" = 1.0 }

[export]
ontology_iri = "urn:zontologize:ontology"

[[sources]]
name = "projects"
kind = "folder"
root = "../../tests/fixtures/acme/projects"
dataset = "current"
ignore = []

[[sources]]
name = "archive"
kind = "folder"
root = "../../tests/fixtures/acme/archive"
dataset = "legacy"
ignore = ["**/*.bak"]
